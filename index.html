<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>B1 2-inch Circle Printer</title>

<style>
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    margin:0;
    background:#f5f5f7;
    color:#111;
  }

  .wrap{
    max-width:560px;
    margin:auto;
    padding:24px 18px 40px;
  }

  .card{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 2px 14px rgba(0,0,0,.08);
    margin-bottom:16px;
  }

  h1{
    font-size:25px;
    margin:0 0 8px;
  }

  p{
    line-height:1.4;
  }

  button,.pick{
    display:block;
    width:100%;
    box-sizing:border-box;
    border:0;
    border-radius:14px;
    padding:15px 14px;
    font-size:17px;
    font-weight:650;
    margin-top:12px;
    text-align:center;
  }

  .pick{
    background:#e9e9ed;
  }

  .primary{
    background:#111;
    color:white;
  }

  .secondary{
    background:#dedee4;
    color:#111;
  }

  input[type=file]{
    display:none;
  }

  #preview{
    display:none;
    width:300px;
    height:300px;
    max-width:90%;
    object-fit:contain;
    margin:16px auto 4px;
    border-radius:50%;
    border:1px solid #ddd;
    background:white;
  }

  .row{
    display:flex;
    gap:10px;
  }

  .row>*{
    flex:1;
  }

  label.small{
    font-size:14px;
    color:#555;
    display:block;
    margin:14px 0 6px;
  }

  input[type=range]{
    width:100%;
  }

  #status{
    font-size:14px;
    white-space:pre-wrap;
    background:#f3f3f5;
    border-radius:12px;
    padding:12px;
    min-height:42px;
  }

  .note{
    font-size:13px;
    color:#666;
  }
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>NIIMBOT B1 — 2" Circle</h1>

    <p>
      Upload your label image, connect the B1, then print one test label.
    </p>

    <label class="pick" for="file">
      Choose Label Picture
    </label>

    <input
      id="file"
      type="file"
      accept="image/*"
    >

    <img id="preview" alt="Preview">

    <label class="small">
      Darkness:
      <span id="densityOut">3</span>
    </label>

    <input
      id="density"
      type="range"
      min="1"
      max="5"
      value="3"
    >

    <div class="row">

      <button
        id="connect"
        class="secondary">
        Connect B1
      </button>

      <button
        id="print"
        class="primary">
        Print 1 Label
      </button>

    </div>

    <p class="note">
      2-inch circle = 50.8 mm.
      B1 printable width is 384 px.
      This page uses 384 × 406 px.
    </p>

  </div>

  <div class="card">

    <strong>Status</strong>

    <div id="status">
      Ready.
    </div>

  </div>

</div>


<script src="https://iscarelli.github.io/niimbot-web-bluetooth/src/niimbot.js"></script>

<script>

const file =
  document.getElementById("file");

const preview =
  document.getElementById("preview");

const statusEl =
  document.getElementById("status");

const density =
  document.getElementById("density");

const densityOut =
  document.getElementById("densityOut");

let imageUrl = null;


const model = {
  label: "Niimbot B1",
  id: 4096,
  dpi: 203,
  protocol: "v4",
  task: "b1",
  density: 3,
  label_type: 1,
  speed: 1,
  name_prefixes: ["B1"]
};


/*
  50.8 mm × 203 dpi / 25.4 ≈ 406 px

  B1 printhead is 384 px wide.
*/

const size = {
  label: "50.8 × 50.8 mm",
  code: "CUSTOM_2IN",
  w_mm: 50.8,
  h_mm: 50.8,
  w_px: 384,
  h_px: 406,
  margin: 8,
  offset_y_px: 4,
  dpi: 203
};


function setStatus(message) {
  statusEl.textContent = message;
}


density.oninput = () => {
  densityOut.textContent = density.value;
};


file.onchange = () => {

  const selectedFile =
    file.files && file.files[0];

  if (!selectedFile) {
    return;
  }

  if (imageUrl) {
    URL.revokeObjectURL(imageUrl);
  }

  imageUrl =
    URL.createObjectURL(selectedFile);

  preview.src = imageUrl;

  preview.style.display = "block";

  setStatus(
    "Image loaded. Connect the B1."
  );

};


document
.getElementById("connect")
.onclick = async () => {

  try {

    if (!window.Niimbot) {
      throw new Error(
        "NIIMBOT driver did not load."
      );
    }

    if (!Niimbot.isSupported()) {
      throw new Error(
        "Use Chrome or Edge on desktop."
      );
    }


    /*
      B1 needs paced BLE writes.
      The driver documentation recommends
      PACE_MS >= 10 if PageEnd fails.
    */

    Niimbot.WRITE_MODE = "paced";

    Niimbot.PACE_MS = 16;

    Niimbot.BUNDLE_MAX = 180;

    Niimbot.PAGE_WAIT_MS = 40000;

    Niimbot.DEBUG = true;


    setStatus(
      "Opening Bluetooth chooser..."
    );


    const info =
      await Niimbot.identify(model);


    setStatus(
      "Connected.\n" +
      "Model ID: " +
      (info?.modelId ?? "unknown") +
      "\nTask: " +
      (info?.task ?? "unknown") +
      "\nDPI: " +
      (info?.dpi ?? "unknown")
    );


  } catch (error) {

    setStatus(
      "Connect error: " +
      (error.message || error)
    );

  }

};


document
.getElementById("print")
.onclick = async () => {

  try {

    if (!imageUrl) {
      throw new Error(
        "Choose your label picture first."
      );
    }

    if (!window.Niimbot) {
      throw new Error(
        "NIIMBOT driver did not load."
      );
    }


    /*
      Re-apply conservative settings
      in case the page reconnected.
    */

    Niimbot.WRITE_MODE = "paced";

    Niimbot.PACE_MS = 16;

    Niimbot.BUNDLE_MAX = 180;

    Niimbot.PAGE_WAIT_MS = 40000;


    setStatus(
      "Printing..."
    );


    await Niimbot.printImage(
      imageUrl,
      {
        model,
        size,
        copies: 1,
        density:
          Number(density.value),

        onProgress: (message) => {
          setStatus(message);
        }
      }
    );


    setStatus(
      "Print confirmed. Check the label."
    );


  } catch (error) {

    console.error(error);

    setStatus(
      "Print error: " +
      (error.message || error)
    );

  }

};

</script>

</body>
</html>
