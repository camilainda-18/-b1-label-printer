<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B1 2-Inch Circle Printer</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  background:#f5f5f7;
  color:#111;
}

.wrap{
  max-width:600px;
  margin:auto;
  padding:24px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

button,.fileButton{
  width:100%;
  box-sizing:border-box;
  padding:15px;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:600;
  margin-top:12px;
}

.fileButton{
  display:block;
  background:#e5e5ea;
  text-align:center;
  cursor:pointer;
}

button{
  cursor:pointer;
}

.connect{
  background:#dddde3;
}

.print{
  background:#111;
  color:#fff;
}

input[type=file]{
  display:none;
}

input[type=range]{
  width:100%;
}

#previewWrap{
  width:320px;
  height:320px;
  max-width:90%;
  margin:20px auto;
  border:1px solid #ddd;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#preview{
  max-width:82%;
  max-height:82%;
  object-fit:contain;
  display:none;
}

.status{
  margin-top:18px;
  background:#f2f2f5;
  padding:14px;
  border-radius:12px;
  white-space:pre-wrap;
}

.small{
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<h1>NIIMBOT B1 — 2" Circle</h1>

<p>
Upload your label image, connect the B1, then print one circle.
</p>

<label class="fileButton" for="imageInput">
Choose Label Picture
</label>

<input id="imageInput" type="file" accept="image/*">

<div id="previewWrap">
  <img id="preview">
</div>

<label>
Darkness:
<strong id="densityValue">3</strong>
</label>

<input id="density" type="range" min="1" max="5" value="3">

<button id="connectButton" class="connect">
Connect B1
</button>

<button id="printButton" class="print">
Print 1 Label
</button>

<p class="small">
2-inch circles = 50.8 mm. The B1 printhead is 384 px wide.
</p>

<div id="status" class="status">
Ready.
</div>

</div>

</div>


<script src="https://iscarelli.github.io/niimbot-web-bluetooth/src/niimbot.js"></script>

<script>

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const status =
  document.getElementById("status");

const density =
  document.getElementById("density");

const densityValue =
  document.getElementById("densityValue");

const connectButton =
  document.getElementById("connectButton");

const printButton =
  document.getElementById("printButton");


let imageUrl = null;


// NIIMBOT B1
const model = {
  label: "Niimbot B1",
  id: 4096,
  name_prefixes:["B1"],
  task:"b1",
  dpi:203,
  density:3,
  label_type:1,
  speed:1
};


// 2-inch circle
// B1 printhead = 384 px wide
// 50.8 mm tall ≈ 406 px at 203 DPI
const size = {
  label:"2 inch circle",
  w_px:384,
  h_px:406,
  offset_y_px:0
};


function setStatus(text){
  status.textContent = text;
}


density.oninput = () => {
  densityValue.textContent = density.value;
};


imageInput.onchange = () => {

  const file =
    imageInput.files &&
    imageInput.files[0];

  if(!file)
    return;


  if(imageUrl)
    URL.revokeObjectURL(imageUrl);


  imageUrl =
    URL.createObjectURL(file);


  preview.src =
    imageUrl;


  preview.style.display =
    "block";


  setStatus(
    "Image loaded."
  );
};


connectButton.onclick = async () => {

  try{

    if(!window.Niimbot)
      throw new Error(
        "Driver failed to load."
      );


    if(!Niimbot.isSupported())
      throw new Error(
        "Use Chrome or Edge."
      );


    setStatus(
      "Opening Bluetooth..."
    );


    const info =
      await Niimbot.identify(model);


    setStatus(
      "Connected to B1.\n" +
      JSON.stringify(info,null,2)
    );


  }catch(error){

    setStatus(
      "Connect error:\n" +
      (error.message || error)
    );

  }

};


printButton.onclick = async () => {

  try{

    if(!imageUrl)
      throw new Error(
        "Choose your logo first."
      );


    printButton.disabled = true;


    setStatus(
      "Printing..."
    );


    await Niimbot.printImage(
      imageUrl,
      {
        model:model,
        size:size,
        copies:1,
        density:
          Number(density.value),

        onProgress:
          (message) =>
            setStatus(message)
      }
    );


    setStatus(
      "Finished. Check the label."
    );


  }catch(error){

    console.error(error);


    setStatus(
      "Print error:\n" +
      (error.message || error)
    );


  }finally{

    printButton.disabled = false;

  }

};

</script>

</body>
</html>
