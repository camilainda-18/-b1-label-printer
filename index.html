<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>B1 1-inch Circle Printer</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#111}
  .wrap{max-width:560px;margin:auto;padding:24px 18px 40px}
  .card{background:white;border-radius:18px;padding:18px;box-shadow:0 2px 14px rgba(0,0,0,.08);margin-bottom:16px}
  h1{font-size:25px;margin:0 0 8px} p{line-height:1.4}
  button,.pick{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:15px 14px;font-size:17px;font-weight:650;margin-top:12px;text-align:center}
  .pick{background:#e9e9ed}.primary{background:#111;color:white}.secondary{background:#dedee4;color:#111}
  input[type=file]{display:none}
  #preview{display:none;width:203px;height:203px;object-fit:contain;margin:16px auto 4px;border-radius:50%;border:1px solid #ddd;background:white}
  .row{display:flex;gap:10px}.row>*{flex:1}
  label.small{font-size:14px;color:#555;display:block;margin:14px 0 6px}
  input[type=range]{width:100%}
  #status{font-size:14px;white-space:pre-wrap;background:#f3f3f5;border-radius:12px;padding:12px;min-height:42px}
  .note{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>NIIMBOT B1 — 1" Circle</h1>
    <p>Choose your label picture, connect the B1, then print one test label. This bypasses NIIMBOT's RFID label selection.</p>
    <label class="pick" for="file">Choose Label Picture</label>
    <input id="file" type="file" accept="image/*" />
    <img id="preview" alt="Preview" />
    <label class="small">Darkness: <span id="densityOut">3</span></label>
    <input id="density" type="range" min="1" max="5" value="3" />
    <div class="row">
      <button id="connect" class="secondary">Connect B1</button>
      <button id="print" class="primary">Print 1 Label</button>
    </div>
    <p class="note">Use in Bluefy. Keep the NIIMBOT app completely closed. Your 1-inch label is 25.4 mm; this page uses about 203×203 px at 203 dpi.</p>
  </div>
  <div class="card"><strong>Status</strong><div id="status">Ready.</div></div>
</div>
<script src="https://iscarelli.github.io/niimbot-web-bluetooth/src/niimbot.js"></script>
<script>
const file = document.getElementById('file');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const density = document.getElementById('density');
const densityOut = document.getElementById('densityOut');
let imageUrl = null;

// B1 @ 203 dpi. 25.4mm ≈ 203px. Keep width under B1's 384px head.
const model = { name_prefixes:["B1"], task:"b1", dpi:203, density:3, label_type:1, speed:1, id:4096 };
const size = { w_px:203, h_px:203, offset_y_px:0 };

function setStatus(s){ statusEl.textContent=s; }
density.oninput=()=>densityOut.textContent=density.value;
file.onchange=()=>{
  const f=file.files && file.files[0];
  if(!f) return;
  if(imageUrl) URL.revokeObjectURL(imageUrl);
  imageUrl=URL.createObjectURL(f);
  preview.src=imageUrl; preview.style.display='block';
  setStatus('Image loaded. Tap Connect B1.');
};

document.getElementById('connect').onclick=async()=>{
  try{
    if(!window.Niimbot) throw new Error('Printer driver did not load. Make sure you have internet access.');
    if(!Niimbot.isSupported()) throw new Error('Web Bluetooth is not available here. Open this page in Bluefy.');
    setStatus('Opening Bluetooth chooser…');
    const info=await Niimbot.identify(model);
    setStatus('Connected: '+JSON.stringify(info));
  }catch(e){ setStatus('Connect error: '+(e.message||e)); }
};

document.getElementById('print').onclick=async()=>{
  try{
    if(!imageUrl) throw new Error('Choose your label picture first.');
    if(!window.Niimbot) throw new Error('Printer driver did not load.');
    setStatus('Printing…');
    await Niimbot.printImage(imageUrl,{model,size,copies:1,density:Number(density.value),onProgress:setStatus});
    setStatus('Done. Check the label.');
  }catch(e){ setStatus('Print error: '+(e.message||e)); }
};
</script>
</body>
</html>
